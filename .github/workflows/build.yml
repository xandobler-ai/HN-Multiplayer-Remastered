name: Build Hello Neighbor Multiplayer DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository ZIP
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" `
            -OutFile repo.zip

      - name: Extract repository
        shell: cmd
        run: |
          mkdir repo
          7z x repo.zip -orepo -y

      - name: Find source files
        shell: powershell
        run: |
          Get-ChildItem repo -Recurse -File |
            Where-Object {
              $_.Name -eq "HelloNeighborMultiplayer.cpp"
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $source = Get-ChildItem repo -Recurse -Filter "HelloNeighborMultiplayer.cpp" |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "HelloNeighborMultiplayer.cpp was not found!"
            exit 1
          }

          Write-Host "Building: $($source.FullName)"

          cl.exe /LD /EHsc /std:c++20 `
            "$($source.FullName)" `
            /link /OUT:"$PWD\build\HelloNeighborMultiplayer.dll"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HelloNeighborMultiplayer-DLL
          path: build/HelloNeighborMultiplayer.dll
